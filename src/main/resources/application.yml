spring:
  application:
    name: owner-service

  datasource:
    url: jdbc:postgresql://localhost:5432/booker
    username: booker_app
    password: ${DB_PASSWORD:booker_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

server:
  port: 8082

jwt:
  # MUST match the secret used by user-service exactly.
  secret: ${JWT_SECRET:dev-shared-secret-please-change-at-least-32-characters-long}
  access-token-expiry-seconds: 900
  refresh-token-expiry-seconds: 1209600

logging:
  level:
    com.malek.owner_service: INFO
    org.hibernate.SQL: WARN